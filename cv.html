<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <a href="index.html">Bio</a>
    <a href="cv.html"><strong>CV</strong></a>
    <button class="theme-toggle-btn" id="themeToggle">Toggle Theme</button>
  </nav>

  <main>
    <!-- Education Section -->
    <section class="cv-section">
      <h2 class="cv-header">Education</h2>
      
      <div class="entry-list">
        <!-- UC San Diego Entry -->
        <div class="entry-item">
          <!-- UC San Diego Logo -->
          <div class="entry-logo-container" aria-hidden="true">
            <svg class="entry-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          
          <!-- Details -->
          <div class="entry-content">
            <div class="entry-header">
              <div class="entry-left">
                <h3 class="entry-title">BS Molecular Cell Biology</h3>
                <span class="entry-org">UC San Diego</span>
              </div>
              <div class="entry-right">
                <span class="entry-date">2021-2025</span>
                <span class="entry-location">San Diego, CA</span>
              </div>
            </div>
            <div class="entry-details">
              TESTING
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Experience Section -->
    <section class="cv-section">
      <h2 class="cv-header">Experience</h2>
      
      <div class="entry-list">
        <!-- MGH Entry -->
        <div class="entry-item">
          <!-- MGH Logo -->
          <div class="entry-logo-container" aria-hidden="true">
            <svg class="entry-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
              <path d="M12 5v8M10 9h4"/>
            </svg>
          </div>
          
          <!-- Details -->
          <div class="entry-content">
            <div class="entry-header">
              <div class="entry-left">
                <h3 class="entry-title">Research Assistant</h3>
                <span class="entry-org">MGH</span>
              </div>
              <div class="entry-right">
                <span class="entry-date">2025-Present</span>
                <span class="entry-location">Boston, MA</span>
              </div>
            </div>
            <div class="entry-details">
              TESTING
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Skills Section -->
    <section class="cv-section">
      <h2 class="cv-header">Skills</h2>
      <div class="entry-list">
        <div class="entry-item">
          <div class="entry-logo-container" aria-hidden="true">
            <svg class="entry-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </div>
          <div class="entry-content">
            <div class="entry-header">
              <div class="entry-left">
                <h3 class="entry-title">Technical Skills</h3>
                <span class="entry-org">Core Proficiencies</span>
              </div>
            </div>
            <div class="entry-details">
              TESTING
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
