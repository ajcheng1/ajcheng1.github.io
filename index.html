<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alvin Cheng — Personal Homepage</title>
  <meta name="description" content="Personal homepage of Alvin Cheng.">

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Custom Configuration & Custom Variants for dark mode -->
  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
    }
    @custom-variant dark (&:where(.dark, .dark *));
  </style>

  <!-- Inline Script to prevent theme flashing on load -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body
  class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 transition-colors duration-500 min-h-screen relative overflow-x-hidden selection:bg-neutral-200 dark:selection:bg-neutral-800 selection:text-neutral-900 dark:selection:text-neutral-50">

  <!-- Subtle premium background gradient glow -->
  <div class="absolute inset-0 -z-10 pointer-events-none opacity-40 dark:opacity-20 transition-opacity duration-500">
    <div
      class="absolute top-0 right-0 w-[500px] h-[500px] bg-gradient-to-bl from-blue-200/40 to-transparent dark:from-blue-900/10 blur-3xl">
    </div>
    <div
      class="absolute top-1/4 left-0 w-[300px] h-[300px] bg-gradient-to-tr from-neutral-200/30 to-transparent dark:from-neutral-900/20 blur-2xl">
    </div>
  </div>

  <div class="max-w-4xl mx-auto px-6 md:px-8 py-6 min-h-screen flex flex-col justify-between">
    <div>
      <!-- Top Navigation Bar -->
      <nav
        class="flex justify-between items-center py-4 border-b border-neutral-200/50 dark:border-neutral-800/50 transition-colors duration-500">
        <!-- Nav Menu -->
        <ul class="flex items-center gap-6 md:gap-8">
          <li>
            <a href="index.html"
              class="text-sm font-semibold text-neutral-900 dark:text-neutral-50 transition-colors tracking-wide">
              Home
            </a>
          </li>
          <li>
            <a href="#cv"
              class="text-sm font-medium text-neutral-400 dark:text-neutral-500 hover:text-neutral-900 dark:hover:text-neutral-200 transition-colors tracking-wide">
              CV
            </a>
          </li>
          <li>
            <a href="projects.html"
              class="text-sm font-medium text-neutral-400 dark:text-neutral-500 hover:text-neutral-900 dark:hover:text-neutral-200 transition-colors tracking-wide">
              Projects
            </a>
          </li>
        </ul>

        <!-- Day/Night Switch and Label Container -->
        <div class="flex items-center gap-3">
          <span
            class="text-xs font-semibold text-neutral-400 dark:text-neutral-500 tracking-wider uppercase select-none">
            Day/Night
          </span>
          <button id="theme-toggle"
            class="w-12 h-6.5 rounded-full bg-neutral-200/80 dark:bg-neutral-800 border border-neutral-300/30 dark:border-neutral-700/50 relative cursor-pointer outline-none transition-colors duration-300 focus-visible:ring-2 focus-visible:ring-neutral-400 dark:focus-visible:ring-neutral-600"
            aria-label="Toggle day and night theme">
            <!-- Slider dot -->
            <span
              class="w-5.5 h-5.5 rounded-full bg-white dark:bg-neutral-950 shadow-md absolute left-0.5 top-0.5 transition-transform duration-300 ease-out transform dark:translate-x-5.5 flex items-center justify-center">
              <!-- Sun Icon (visible in light mode) -->
              <svg class="w-3.5 h-3.5 text-amber-500 dark:hidden" fill="currentColor" viewBox="0 0 20 20">
                <path
                  d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 14.05a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zm-.707-8.485a1 1 0 010-1.414l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414 0zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" />
              </svg>
              <!-- Moon Icon (visible in dark mode) -->
              <svg class="w-3.5 h-3.5 text-sky-400 hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
              </svg>
            </span>
          </button>
        </div>
      </nav>

      <!-- Main Hero Section -->
      <main id="home" class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-12 pt-6 items-start">

        <!-- Left Column: Name & Bio -->
        <div class="md:col-span-8 space-y-3">
          <h1
            class="text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight text-neutral-900 dark:text-white leading-none">
            Alvin Cheng
          </h1>
          <p class="text-lg md:text-xl text-neutral-500 dark:text-neutral-400 font-small leading-relaxed max-w-lg">
            I am a Clinical Research Coordinator at Massachusetts General Hospital in the Bone Marrow Transplant
            Program.
          </p>
        </div>

        <!-- Right Column: Profile Sidebar -->
        <aside class="md:col-span-4 flex flex-col items-start gap-6">
          <!-- Circular placeholder image for a profile photo -->
          <div
            class="w-28 h-28 rounded-full bg-neutral-200/60 dark:bg-neutral-800/80 border border-neutral-300/30 dark:border-neutral-700/50 flex items-center justify-center shadow-inner relative overflow-hidden group hover:scale-[1.02] transition-transform duration-300">
            <!-- Icon placeholder -->
            <svg class="w-12 h-12 text-neutral-400/80 dark:text-neutral-500/80" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
          </div>

          <!-- Stacked Information -->
          <div class="space-y-2 flex flex-col items-start">
            <!-- Location -->
            <div
              class="flex items-center gap-2 text-sm font-semibold text-neutral-600 dark:text-neutral-400 select-none">
              <svg class="w-4 h-4 text-neutral-400 dark:text-neutral-500" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>Boston, MA</span>
            </div>

            <!-- LinkedIn Placeholder -->
            <div
              class="flex items-center gap-2 text-sm font-medium text-neutral-400 dark:text-neutral-600 cursor-not-allowed select-none group">
              <svg class="w-4 h-4 text-neutral-300 dark:text-neutral-700" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
              </svg>
              <span
                class="group-hover:text-neutral-500 dark:group-hover:text-neutral-500 transition-colors">LinkedIn</span>
            </div>

            <!-- GitHub Placeholder -->
            <div
              class="flex items-center gap-2 text-sm font-medium text-neutral-400 dark:text-neutral-600 cursor-not-allowed select-none group">
              <svg class="w-4 h-4 text-neutral-300 dark:text-neutral-700" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.646.64.699 1.026 1.592 1.026 2.683 0 3.842-2.337 4.687-4.565 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.579.688.481C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
              </svg>
              <span
                class="group-hover:text-neutral-500 dark:group-hover:text-neutral-500 transition-colors">GitHub</span>
            </div>
          </div>
        </aside>

      </main>
    </div>

    <!-- Footer -->
    <footer class="pt-16 pb-4 text-center">
      <p class="text-xs text-neutral-400 dark:text-neutral-600 font-medium">
        &copy; 2026 Alvin Cheng. Built with Tailwind CSS.
      </p>
    </footer>
  </div>

  <!-- Theme toggle Logic Script -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');

    themeToggleBtn.addEventListener('click', () => {
      // Toggle class
      document.documentElement.classList.toggle('dark');

      // Update local storage
      if (document.documentElement.classList.contains('dark')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
</body>

</html>
