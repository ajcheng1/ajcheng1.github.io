<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alvin Cheng | Home</title>
  <meta name="description" content="Personal website of Alvin Cheng.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Dark Mode Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

  <!-- 1. Top Navigation Bar -->
  <header class="w-full border-b border-slate-200 dark:border-slate-800 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      
      <!-- Left-aligned Links -->
      <nav aria-label="Main Navigation">
        <ul class="flex items-center space-x-8 text-sm font-medium text-slate-500 dark:text-slate-400">
          <li>
            <a href="index.html" class="hover:text-slate-900 dark:hover:text-slate-100 transition-colors text-slate-900 dark:text-slate-100 font-semibold">Home</a>
          </li>
          <li>
            <a href="cv.html" class="hover:text-slate-900 dark:hover:text-slate-100 transition-colors">CV</a>
          </li>
          <li>
            <a href="#" class="hover:text-slate-900 dark:hover:text-slate-100 transition-colors">Projects</a>
          </li>
        </ul>
      </nav>

      <!-- Right-aligned Toggle Button -->
      <div>
        <button id="themeToggle" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95" aria-label="Toggle light and dark theme">
          <!-- Sun Icon (Visible in dark mode) -->
          <svg class="w-5 h-5 hidden dark:block text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon Icon (Visible in light mode) -->
          <svg class="w-5 h-5 block dark:hidden text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- 2. Hero Section (Two-Column Layout) -->
  <main class="flex-grow flex items-center py-16">
    <div class="max-w-4xl mx-auto px-6 w-full grid grid-cols-1 md:grid-cols-[1.8fr_1fr] gap-12 items-center">
      
      <!-- Left Column (Main Content) -->
      <div class="space-y-6">
        <h1 class="text-4xl font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-slate-100 dark:to-slate-300 bg-clip-text text-transparent">
          Alvin Cheng
        </h1>
        <p class="text-base text-slate-600 dark:text-slate-300 leading-relaxed max-w-xl">
          TESTING
        </p>
      </div>

      <!-- Right Column (Profile Sidebar) -->
      <div class="flex flex-col items-center text-center space-y-6">
        <!-- Profile Image Area -->
        <div class="w-48 h-48 rounded-full overflow-hidden border-2 border-slate-200 dark:border-slate-800 shadow-lg bg-slate-200 dark:bg-slate-900 flex items-center justify-center">
          <img src="assets/images/avatar.jpg" alt="Alvin Cheng" class="w-full h-full object-cover">
        </div>

        <!-- Contact Details -->
        <div class="space-y-3 text-sm text-slate-500 dark:text-slate-400 font-medium">
          <!-- Location -->
          <div class="flex items-center justify-center space-x-2 text-slate-700 dark:text-slate-300">
            <svg class="w-4 h-4 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Boston, MA</span>
          </div>

          <!-- Plain Text Placeholders -->
          <div class="flex flex-col space-y-1">
            <div class="text-slate-400 dark:text-slate-500">LinkedIn</div>
            <div class="text-slate-400 dark:text-slate-500">GitHub</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-8 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400 dark:text-slate-600 font-mono">
    <div class="max-w-4xl mx-auto px-6">
      <p>© 2026 Alvin Cheng. Built with Tailwind CSS.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
</body>
</html>
