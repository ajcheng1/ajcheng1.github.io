<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- MGH Style Medical Blue & White Shield Emblem -->
  <rect width="200" height="200" fill="#005A9C" rx="20"/>
  <!-- Hospital building / Shield grid shape inside -->
  <path d="M50 40 L150 40 L150 120 C150 150, 100 170, 100 170 C100 170, 50 150, 50 120 Z" fill="#ffffff"/>
  <!-- Blue Medical Cross in the center -->
  <rect x="90" y="65" width="20" height="60" fill="#005A9C" rx="3"/>
  <rect x="70" y="85" width="60" height="20" fill="#005A9C" rx="3"/>
  <!-- MGH text overlay -->
  <text x="100" y="150" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#005A9C" text-anchor="middle">MGH</text>
  <!-- Small details mimicking the historical crest columns -->
  <line x1="65" y1="52" x2="135" y2="52" stroke="#005A9C" stroke-width="4"/>
  <line x1="65" y1="115" x2="135" y2="115" stroke="#005A9C" stroke-width="4"/>
</svg>
